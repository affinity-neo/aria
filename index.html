/* Product UI refinement: consistent controls, hierarchy, and focus states */
:root{--ui-border:#dfe3e8;--ui-muted:#737b87}
.vtab{border-radius:7px;transition:background .14s ease,color .14s ease}
.vtab:hover{background:var(--sf2)}
.vtab.on{font-weight:600}
.lk,.nv button,.nv select,.nv input{transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease}
.nv thead th{font-weight:600;letter-spacing:.01em;color:var(--ui-muted)}
.nv td{vertical-align:middle}
.nv .lc{cursor:pointer}
.nv .lc:hover .pill{box-shadow:inset 0 0 0 1px #00000018;filter:brightness(.98)}
.nv .pill{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:5px;white-space:nowrap}
.nv button:focus-visible,.nv select:focus-visible,.lk:focus-visible,.vtab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nv select{max-width:100%;border:1px solid var(--ui-border);border-radius:6px;padding:6px 9px;background:var(--sf);color:var(--tx);font:inherit}
.nv select:hover{border-color:#b8c0cb}
@media(max-width:650px){.nv{font-size:13px}.nv td,.nv th{padding:8px 7px}.vtab{padding-inline:10px}}

function sortL(l,cfgSort){let a=[...l],pi=t=>LB('priority').findIndex(x=>x.n===t.priority),si=t=>LB('status').findIndex(x=>x.n===t.status),get=(t,k)=>k==='due'?(t.due||'9999'):k==='pri'?pi(t):k==='st'?si(t):t.task;let rules=cfgSort&&typeof cfgSort==='object'?(cfgSort.sorts||[]):[];if(!rules.length&&cfgSort&&typeof cfgSort==='object'&&cfgSort.sort&&cfgSort.sort!=='none'&&cfgSort.sort!=='multi')rules=[{key:cfgSort.sort,dir:'asc'}];if(!rules.length&&typeof cfgSort==='string'&&cfgSort!=='none'&&cfgSort!=='multi')rules=[{key:cfgSort,dir:'asc'}];return a.sort((x,y)=>{for(const r of rules){let ax=get(x,r.key),ay=get(y,r.key),d=typeof ax==='number'?ax-ay:String(ax).localeCompare(String(ay),'ko');if(d)return r.dir==='desc'?-d:d}return 0})}
function groupsFor(l,gb){let o=[];if(gb==='company')S.groups.forEach(g=>o.push({val:g.name,color:g.color,list:l.filter(t=>t.company===g.name)}));else if(gb==='due')DN.forEach((n,i)=>o.push({val:n,color:['#e2445c','#fdab3d','#ffcb00','#0073ea','#808080','#b0b3c0'][i],list:l.filter(t=>dueG(t)===n),subs:l.flatMap(t=>t.subs.filter(s=>!isD(s)&&s.due&&dueG(s)===n).map(s=>({t,s}))).sort((a,b)=>a.s.due.localeCompare(b.s.due))}));else if(gb==='long'){[['긴 작업','#a25ddc'],['빠른 작업','#579bfc'],['위임','#fdab3d'],['대기','#00c875'],['미지정','#9aa0a6']].forEach(([v,c])=>o.push({val:v,color:c,list:l.filter(t=>((t.cx||{}).workType||'미지정')===v)}))}else if(gb==='pri')LB('priority').forEach(x=>o.push({val:x.n,color:x.c,list:l.filter(t=>t.priority===x.n)}));else if(gb==='st')LB('status').filter(x=>!x.d).forEach(x=>o.push({val:x.n,color:x.c,list:l.filter(t=>t.status===x.n)}));else{LB('person').forEach(x=>o.push({val:x.n,color:x.c,list:l.filter(t=>taskAssignees(t).includes(x.n))}));o.push({val:'',color:'#808080',list:l.filter(t=>!taskAssignees(t).length)})}o.forEach(g=>g.label=g.val||'담당자 미정');return gb==='company'?o:o.filter(g=>g.list.length||(g.subs&&g.subs.length))}

function morningRoutineText(){let T=today(),r=dailyReport(T),plan=S.tasks.filter(t=>!isD(t)&&!isPersonalTask(t)&&!isCourseTask(t)&&!isWaitingTask(t)&&!isPinnedWaiting(t)&&t.cx&&t.cx.planDate===T),dead=plan.filter(t=>t.due===T).concat(S.tasks.filter(t=>!isD(t)&&!isPersonalTask(t)&&!isCourseTask(t)&&!isWaitingTask(t)&&t.due===T&&!plan.includes(t)));return ['[오늘 업무 계획] '+T,'□ 투두메이트에 오늘 계획 옮기기','□ 일정/수업 시간과 충돌 여부 확인',...plan.map(t=>'□ '+t.task),...(dead.length?['','[오늘 실제 마감 - 즉시 처리]',...dead.map(t=>'🚨 '+t.task)]:[]),...(r.morningNote?['','[메모]',r.morningNote]:[])].join('\n')}

function openEveningRoutine(){let tomorrow=addD(1),d=new Date(tomorrow+'T00:00:00').getDay(),r=dailyReport(tomorrow),classes=(S.fixedEvents||[]).filter(e=>e.kind==='weekly'?(e.days||[]).includes(d):e.date===tomorrow),tasks=S.tasks.filter(t=>!isD(t)&&isCourseTask(t)&&((t.due||'')===tomorrow||(t.cx&&t.cx.planDate)===tomorrow));let list=(kind,items,prefix)=>'<section class="routine-section"><h3>'+kind+'</h3>'+(items.length?items.map(x=>'<label class="routine-check"><input type="checkbox" '+((r.eveningDone||[]).includes(prefix+x.id)?'checked':'')+' onchange="toggleRoutineCheck(\'evening\',\''+prefix+x.id+'\',this.checked)"><span>'+esc(x.name||x.task)+'</span><small>'+(x.start?(x.start+'–'+x.end):(x.due?'마감 '+x.due:''))+'</small></label>').join(''):'<p class="routine-empty">내일 확인할 항목이 없어요.</p>')+'</section>';modal('<div class="routine-modal"><h2>저녁 점검 · 내일 일정</h2><p>'+tomorrow+' 수업과 수업 전 과제를 미리 확인해요.</p>'+list('내일 수업',classes,'class:')+list('내일 확인할 수업 과제',tasks,'course:')+'<label class="routine-note">추가 메모<textarea class="inp" rows="3" onblur="saveRoutineNote(\'evening\',this.value)">'+esc(r.eveningNote||'')+'</textarea></label><div class="ma"><button onclick="closeM()">닫기</button><button class="primary" onclick="copyRoutineText(eveningRoutineText())">내일 일정 복사</button></div></div>')}

function vDoneTasks(){let l=S.tasks.filter(isD).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')),groups={};l.forEach(t=>{let day=t.doneAt||'완료일 미기록';(groups[day]||(groups[day]=[])).push(t)});return `<div class="box"><h3>완료 보드 <span class="mu">${l.length}개 · 완료일 기준</span></h3>${Object.entries(groups).map(([day,items])=>`<details class="done-group" ${day===today()?'open':''}><summary><span>${esc(day)}</span><span class="mu">${items.length}개</span></summary><div style="overflow-x:auto"><table class="nv auto" style="min-width:820px"><thead><tr><th>사업</th><th>업무</th><th>담당</th><th>마감일</th><th>완료일</th><th>하위 아이템</th><th></th></tr></thead><tbody>${items.map(t=>`<tr><td class="gn" style="background:${gc(t.company)}44">${esc(t.company)}</td><td class="l">${esc(t.task)}</td><td>${esc(t.person||[...new Set(t.subs.map(s=>s.person).filter(Boolean))].join(', '))}</td><td>${t.due||'-'}</td><td>${t.doneAt||'-'}</td><td>${t.subs.length?t.subs.length+'개':'-'}</td><td><button onclick="undone(${t.id})">되돌리기</button><button class="danger" onclick="delTask(${t.id})">삭제</button></td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<div class="empty">아직 완료된 업무가 없어요.</div>'}</div>`}

function rzStart(e,tk,k){e.preventDefault();e.stopPropagation();closeP();let x0=e.clientX,w0=getW(tk,k),cur=w0,sel=`col[data-k="${tk}:${k}"]`;document.body.classList.add('rzing');
let mv=ev=>{cur=Math.max(60,Math.min(900,Math.round(w0+ev.clientX-x0)));document.querySelectorAll(sel).forEach(c=>c.style.width=cur+'px');applyW(tk)};
