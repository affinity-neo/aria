/* Product UI refinement: consistent controls, hierarchy, and focus states */
:root{--ui-border:#dfe3e8;--ui-muted:#737b87}
.vtab{border-radius:7px;transition:background .14s ease,color .14s ease}
.vtab:hover{background:var(--sf2)}
.vtab.on{font-weight:600}
.lk,.nv button,.nv select,.nv input{transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease}
.nv thead th{font-weight:600;letter-spacing:.01em;color:var(--ui-muted)}
.nv td{vertical-align:middle}
.nv .lc{cursor:pointer}
.nv .lc:hover .pill{box-shadow:inset 0 0 0 1px #00000018;filter:brightness(.98)}
.nv .pill{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:5px;white-space:nowrap}
.nv button:focus-visible,.nv select:focus-visible,.lk:focus-visible,.vtab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nv select{max-width:100%;border:1px solid var(--ui-border);border-radius:6px;padding:6px 9px;background:var(--sf);color:var(--tx);font:inherit}
.nv select:hover{border-color:#b8c0cb}
@media(max-width:650px){.nv{font-size:13px}.nv td,.nv th{padding:8px 7px}.vtab{padding-inline:10px}}

function repeatNextDate(rule,fromDate){if(!rule||!rule.type)return '';const start=String(fromDate||today()),weekday=Math.max(0,Math.min(6,Number(rule.weekday)||0));if(rule.type==='monthly'){const base=new Date(start+'T12:00:00');for(let offset=0;offset<36;offset++){const first=new Date(base.getFullYear(),base.getMonth()+offset,1,12),last=new Date(first.getFullYear(),first.getMonth()+1,0,12),nth=Math.max(1,Math.min(5,Number(rule.nth)||2));let day;if(nth===5){day=last.getDate()-((last.getDay()-weekday+7)%7)}else{day=1+((weekday-first.getDay()+7)%7)+(nth-1)*7;if(day>last.getDate())continue}const candidate=iso(new Date(first.getFullYear(),first.getMonth(),day,12));if(candidate>=start)return candidate}return ''}const anchor=String(rule.anchorDate||start),interval=Math.max(1,Math.min(12,Number(rule.interval)||2)),a=new Date(anchor+'T12:00:00');a.setDate(a.getDate()+((weekday-a.getDay()+7)%7)+interval*7);let candidate=iso(a);while(candidate<start){a.setDate(a.getDate()+interval*7);candidate=iso(a)}return candidate}
function openRepeatSettings(id){const t=find(id);if(!t)return;const current=(t.cx||{}).repeatRule||{},anchor=current.anchorDate||t.cx.planDate||today(),weekday=Number.isInteger(current.weekday)?current.weekday:new Date(anchor+'T12:00:00').getDay(),type=current.type||'monthly';modal('<div class="repeat-settings"><h2>반복 실행 설정</h2><p class="mu">반복 규칙은 이 업무 하나에 계속 유지돼요. 계획만 다음 차례로 갱신하고, 마감일은 따로 보존합니다.</p><label>반복 방식<select id="repeatType" class="inp" onchange="toggleRepeatFields()"><option value="monthly" '+(type==='monthly'?'selected':'')+'>매월 특정 주차·요일</option><option value="weekly" '+(type==='weekly'?'selected':'')+'>몇 주마다 특정 요일</option></select></label><div id="repeatMonthlyFields"><label>몇째 주<select id="repeatNth" class="inp">'+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+((Number(current.nth)||2)===n?'selected':'')+'>'+(n===5?'마지막':n+'째')+'</option>').join('')+'</select></label></div><div id="repeatWeeklyFields"><label>반복 간격(주)<input id="repeatInterval" class="inp" type="number" min="1" max="12" value="'+(Number(current.interval)||2)+'"></label></div><label>요일<select id="repeatWeekday" class="inp">'+['일요일','월요일','화요일','수요일','목요일','금요일','토요일'].map((n,i)=>'<option value="'+i+'" '+(weekday===i?'selected':'')+'>'+n+'</option>').join('')+'</select></label><label>첫 실행 기준일<input id="repeatAnchor" class="inp" type="date" value="'+esc(anchor)+'"></label><p class="repeat-help">다음 실행일 미리보기: <b id="repeatPreview">'+dateShort(t.cx.planDate||repeatNextDate(current,anchor)||anchor)+'</b></p><div class="ma"><button onclick="closeM()">취소</button>'+(current.type?'<button class="danger" onclick="clearRepeatSettings('+id+')">반복 해제</button>':'')+'<button class="primary" onclick="saveRepeatSettings('+id+')">저장</button></div></div>');toggleRepeatFields()}
function toggleRepeatFields(){const type=$('repeatType')&&$('repeatType').value,m=$('repeatMonthlyFields'),w=$('repeatWeeklyFields');if(m)m.style.display=type==='monthly'?'grid':'none';if(w)w.style.display=type==='weekly'?'grid':'none';const preview=$('repeatPreview');if(preview){const rule={type,weekday:Number($('repeatWeekday').value),nth:Number($('repeatNth')&&$('repeatNth').value||2),interval:Number($('repeatInterval')&&$('repeatInterval').value||2),anchorDate:$('repeatAnchor').value};preview.textContent=dateShort(repeatNextDate(rule,rule.anchorDate)||rule.anchorDate)||'날짜를 선택해 주세요.'}}

function vGuide(){return "<div class=\"box guide-view\"><h2>업무 관리 설명서</h2><p>처음 사용하는 사람도 쉽게 따라 할 수 있어요.</p><section><h3>1. 왼쪽 메뉴</h3><dl><dt>오늘 확인</dt><dd>오늘 할 일과 이번 주 할 일을 모아서 보여줘요.</dd><dt>메인 테이블</dt><dd>해야 할 일을 적고, 내용을 고치는 곳이에요.</dd><dt>캘린더</dt><dd>날짜별로 할 일을 보여줘요. 처음에는 한 주의 모든 일정이 보여요.</dd><dt>시간 설정</dt><dd>수업이나 회의처럼 이미 정해진 시간을 적어요.</dd><dt>완료 보드</dt><dd>끝낸 일을 모아서 보여줘요.</dd></dl></section><section><h3>2. 새 업무 적기</h3><p>메인 테이블에서 ‘＋ 업무 추가’를 눌러요. 새 줄이 생기면 해야 할 일을 적어요.</p><ul><li>업무 이름을 누르면 이름을 바꿀 수 있어요.</li><li>상태, 담당자, 날짜 칸을 누르면 내용을 바꿀 수 있어요.</li><li>왼쪽 화살표를 누르면 작은 할 일들이 보여요.</li></ul></section><section><h3>3. 순서 바꾸기</h3><p>위쪽 메뉴나 메인 테이블의 열 제목을 꾹 누른 채 원하는 자리로 끌고 가세요. 손을 떼면 순서가 바뀌어요.</p></section><section><h3>4. 캘린더 보기</h3><p>‘주간’은 일주일을 보여주고, ‘월간’은 한 달을 보여줘요. ‘전체’를 누르면 계획 날짜와 마감 날짜를 모두 볼 수 있어요.</p></section><section><h3>5. 시간 설정하기</h3><p>‘＋ 일정 추가’를 눌러 수업이나 회의 이름과 시간을 적어요. 매주 반복할지, 하루만 등록할지도 고를 수 있어요.</p></section><section><h3>6. 오늘 확인에서 업무 찾기</h3><p>찾고 싶은 업무 오른쪽의 화살표를 누르세요. 메인 테이블이 열리고, 해당 업무가 파란색으로 표시돼요.</p></section></div>"}

const b64=u=>{let a=new Uint8Array(u),t='';for(let i=0;i<a.length;i+=8192)t+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

const ckey=k=>crypto.subtle.importKey('raw',unb64(k),'AES-GCM',false,['encrypt','decrypt']);
async function enc(o,k){let iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(k),new TextEncoder().encode(JSON.stringify(o)));return {iv:b64(iv),ct:b64(ct)}}

async function syncRun(){if(!SY)return;if(syBusy){syQ=true;return}syBusy=true;let again=false;try{
