<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5DE8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aria"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Aria - 할일·일정 관리 AI 비서</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 6c13 0 24 13 24 29 0 11-9 21-24 21S8 46 8 35C8 19 19 6 32 6z' fill='%232F5DE8'/%3E%3Cellipse cx='24' cy='36' rx='3' ry='4.5' fill='%23fff'/%3E%3Cellipse cx='40' cy='36' rx='3' ry='4.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--blue:#2F5DE8;--blue-d:#2347B8;--ink:#111B33;--sub:#6B768F;--line:#E6EAF3;--bg:#F4F6FB;--soft:#E9EFFF;--ok:#1F9D74;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;background:var(--bg)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
nav{order:2;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;color:var(--sub)}
nav button.on{color:var(--blue);font-weight:600}
.brand,.gap{display:none}
.panel{flex:1;min-height:0;display:none;flex-direction:column}
.panel.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:16px 16px 24px}
@media (min-width:860px){
.app{flex-direction:row;box-shadow:0 0 0 1px var(--line)}
nav{order:0;width:228px;display:flex;flex-direction:column;gap:2px;padding:20px 12px;background:#EEF1F7;border:0;border-right:1px solid var(--line)}
nav button{flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;border-radius:10px;color:var(--ink)}
nav button.on{background:var(--blue);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:4px 10px 18px}
.gap{display:block;flex:1}
.scroll{padding:24px 28px}
}
.dh{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:2px 2px 14px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.box h3{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h3 span{font-size:13px;color:var(--sub);font-weight:500}
.hint{font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:8px}
.st{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;margin-top:6px}
.st .dot{width:22px;height:22px;border-radius:50%;border:1.8px solid #B9C2D6;flex:none;display:grid;place-items:center;color:#fff}
.st .dot .ic{width:14px;height:14px;stroke-width:2.8;opacity:0}
.st.ok .dot{background:var(--ok);border-color:var(--ok)}
.st.ok .dot .ic{opacity:1}
.st.ok b{color:var(--sub);text-decoration:line-through}
.st b{font-weight:500;display:block}
.st small{color:var(--sub);font-size:12.5px}
.go,.chip{background:var(--soft);color:var(--blue-d);font-size:13px;font-weight:600;border-radius:999px;padding:7px 13px;flex:none}
.go{margin-left:auto}
.chip.o{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tl{position:relative;height:28px;background:#E9EDF5;border-radius:10px;margin:14px 0 6px;overflow:hidden}
.tl i{position:absolute;top:0;bottom:0;background:var(--blue);opacity:.85;min-width:4px;border-radius:4px}
.tl u{position:absolute;top:0;bottom:0;width:2px;background:var(--red)}
.ax{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.cnt{display:flex;gap:16px;font-size:13px;margin:10px 0}
.cnt b{margin-left:4px}
.say{font-size:14.5px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{display:flex;align-items:center;gap:6px;background:var(--soft);color:var(--blue-d);font-size:13.5px;font-weight:600;border-radius:999px;padding:8px 13px}
.act .ic{width:16px;height:16px}
.up{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.up .d{width:44px;text-align:center;flex:none}
.up .d b{display:block;font-size:22px;line-height:1.1}
.up .d small{font-size:12px;color:var(--sub)}
.up .d.sun b,.up .d.sun small{color:#D2545A}
.up ul{list-style:none;flex:1;min-width:0}
.up li{border-left:3px solid var(--blue);padding-left:10px;margin-bottom:8px;font-size:14.5px;font-weight:500}
.up li small{display:block;color:var(--sub);font-weight:400;font-size:12.5px}
.h2{font-size:13.5px;color:var(--sub);font-weight:600;margin:16px 2px 8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sg .box{margin:0}
.sg .n{font-size:26px;font-weight:700;margin:4px 0 2px}
.sg small{color:var(--sub);font-size:12.5px}
.wk{display:flex;gap:6px;align-items:flex-end;height:60px;margin-top:10px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
.wk i{width:100%;background:var(--blue);border-radius:4px;opacity:.9}
.wk i.z{background:var(--line)}
.fl{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.qa{display:flex;gap:8px;margin-bottom:14px}
.qa input,.comp input,.f input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue);color:#fff}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:500;word-break:break-word}
.row .t small{font-size:12.5px;color:var(--sub);display:flex;gap:4px;align-items:center;margin-top:2px}
.row .t small .ic{width:13px;height:13px}
.row.done .t b{color:var(--sub);text-decoration:line-through}
.ck{width:24px;height:24px;border-radius:8px;border:1.8px solid #B9C2D6;display:grid;place-items:center;color:#fff;flex:none}
.done .ck{background:var(--blue);border-color:var(--blue)}
.ck .ic{width:15px;height:15px;stroke-width:2.6;opacity:0}
.done .ck .ic{opacity:1}
.del{color:#9AA4BA;padding:6px;border-radius:8px}
.mv{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px 4px}
.mv button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.mv button.x{color:var(--red)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:32px 0;line-height:1.7}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.msg.me{justify-content:flex-end}
.msg .av{width:28px;height:28px;flex:none}
.bub{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-line}
.me .bub{background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.ai .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.card{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--soft);display:flex;gap:10px;align-items:center;color:var(--blue-d);white-space:normal}
.card.off{background:var(--bg);color:var(--sub)}
.card.off b{text-decoration:line-through;color:var(--sub)}
.card b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.card small{font-size:12.5px;color:var(--sub)}
.card .undo{margin-left:auto;font-size:12.5px;color:var(--sub);padding:4px 8px}
.cr{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;background:#fff;border-top:1px solid var(--line)}
.comp{display:flex;gap:8px;padding:8px 12px;background:#fff;align-items:center}
.comp input{background:var(--bg)}
.mic{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.mic.rec{background:var(--red);border-color:var(--red);color:#fff}
.tb{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tb b{font-size:16px;margin-right:auto}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.tgw{flex:1;overflow:auto;background:#fff}
.stk{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}
.tgh{display:grid}
.tgh>div{text-align:center;padding:6px 2px;font-size:12.5px;color:var(--sub);min-width:0}
.tgh>div b{display:block;font-size:18px;color:var(--ink)}
.tgh .today b{color:#fff;background:var(--red);border-radius:50%;width:30px;height:30px;line-height:30px;margin:2px auto 0}
.tgh.ad>div{padding:2px;display:flex;flex-direction:column;gap:2px;font-size:11px}
.tgb{display:grid}
.hrs{font-size:11px;color:var(--sub);text-align:right;padding-right:6px}
.hrs div{height:44px;transform:translateY(-7px)}
.col{position:relative;height:1056px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.evb{position:absolute;border-radius:6px;padding:2px 5px;font-size:12px;line-height:1.3;overflow:hidden;color:#fff;border-left:3px solid rgba(0,0,0,.25);text-align:left}
.evb.s{position:static;padding:2px 5px;white-space:nowrap;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.mw{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(84px,1fr);min-height:100%}
.mw>span{text-align:center;font-size:12px;color:var(--sub);padding:6px 0;grid-row:1;height:28px}
.mc{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;align-items:stretch}
.mc b{font-size:13px;font-weight:600}
.mc.off{color:#B4BCCD}
.mc.td b{color:#fff;background:var(--red);border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center}
.mc i{font-style:normal;font-size:11px;color:#fff;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc em{font-style:normal;font-size:11px;color:var(--sub)}
#sh{position:fixed;inset:0;background:rgba(17,27,51,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
#sh.on{display:flex}
#sh>div{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
@media (min-width:860px){#sh{align-items:center}#sh>div{border-radius:20px}}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:var(--sub)}
.f input{border-radius:10px;background:var(--bg);width:100%}
.f.c{flex-direction:row;align-items:center}
.f.c input{width:auto;flex:none}
.btn{background:var(--blue);color:#fff;border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px}
.btn.g{background:var(--soft);color:var(--blue-d)}
.btn.r{background:#FDECEC;color:var(--red)}
.bs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#p-work{overflow:hidden;background:var(--bg)}\n#p-work iframe{display:block;width:100%;height:100%;min-height:0;flex:1;border:0;background:var(--bg)}\n#ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;z-index:10;display:none;max-width:90%;text-align:center}
textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-top:8px}
ol.sp{margin:8px 0 0 18px;font-size:14px;line-height:1.7}
.url{display:flex;gap:8px;margin-top:12px}
.f select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px;width:100%}
.f code,.hint code{background:var(--soft);border-radius:4px;padding:0 4px;word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">
<nav aria-label="메뉴">
  <div class="brand"><svg width="30" height="30"><use href="#blob"/></svg>Aria</div>
  <button class="on" data-a="tab" data-t="dash"><svg class="ic"><use href="#i-grid"/></svg>대시보드</button>
  <button data-a="tab" data-t="todo"><svg class="ic"><use href="#i-todo"/></svg>할 일</button>
  <button data-a="tab" data-t="cal"><svg class="ic"><use href="#i-cal"/></svg>캘린더</button>
  <button data-a="tab" data-t="work"><svg class="ic"><use href="#i-grid"/></svg>업무 관리</button>

<main>
  <section class="panel on" id="p-dash"><div class="scroll" id="dash"></div></section>
  <section class="panel" id="p-todo"><div class="scroll" id="todo"></div></section>
  <section class="panel" id="p-cal"><div id="cal" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></section>
  <section class="panel" id="p-work"><iframe title="AffinityNeo 업무 관리" src="https://affinity-neo.github.io/schedule2/?embed=aria" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></section>

    <div class="scroll" id="chat"></div>

      <input id="ci" placeholder="Aria에게 무엇이든" autocomplete="off" aria-label="Aria에게 말하기">

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const DOW='일월화수목금토';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=n=>'<svg class="ic"><use href="#i-'+n+'"/></svg>';
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const dAt=(ds,t)=>{const [y,m,d]=ds.split('-').map(Number),[h,mi]=(t||'0:0').split(':').map(Number);return new Date(y,m-1,d,h,mi)};
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fT=t=>{const [h,m]=t.split(':').map(Number);return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(m)};
const T=()=>ymd(new Date());
function fD(ds){const t=sod(new Date()),dt=dAt(ds),n=Math.round((dt-t)/864e5),l=n===0?'오늘':n===1?'내일':n===2?'모레':'';
  return (l?l+' · ':'')+(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+DOW[dt.getDay()]+')'}
const RN={daily:'매일',weekly:'매주',monthly:'매월'};

function parse(t){
  const today=sod(new Date()),add=n=>addD(today,n);let d=null,time=null,s=t,m;
  const cut=r=>{s=s.replace(r,' ')};
  if(/모레/.test(s)){d=add(2);cut(/모레/)}
  else if(/내일/.test(s)){d=add(1);cut(/내일/)}
  else if(/오늘/.test(s)){d=add(0);cut(/오늘/)}
  else if(m=s.match(/(\d{1,2})월\s*(\d{1,2})일/)){d=new Date(today.getFullYear(),m[1]-1,+m[2]);if(d<today)d.setFullYear(d.getFullYear()+1);cut(m[0])}
  else if(m=s.match(/(다음\s*주|이번\s*주)?\s*([일월화수목금토])요일/)){
    const i=DOW.indexOf(m[2]);d=(m[1]&&/다음/.test(m[1]))?add(7-today.getDay()+i):add((i-today.getDay()+7)%7);cut(m[0])}
  if(m=s.match(/(오전|오후|아침|점심|저녁|밤)?\s*(\d{1,2})\s*시\s*(?:(반)|(\d{1,2})\s*분)?/)){
    let h=+m[2],mi=m[3]?30:+(m[4]||0),p=m[1]||'';
    if(/오후|저녁|밤/.test(p)&&h<12)h+=12;else if(p==='오전'&&h===12)h=0;else if(!p&&h>=1&&h<=6)h+=12;
    time=pad(h)+':'+pad(mi);cut(m[0]);
  }else if(m=s.match(/(\d{1,2}):(\d{2})/)){time=pad(+m[1])+':'+m[2];cut(m[0])}
  let rep='';if(m=s.match(/매일|매주\s*([일월화수목금토])?\s*요?일?|매월|매달/)){rep=/매일/.test(m[0])?'daily':/매주/.test(m[0])?'weekly':'monthly';
    if(m[1]&&!d){const i=DOW.indexOf(m[1]);d=add((i-today.getDay()+7)%7)}cut(m[0])}
  const sd=/언젠가/.test(t);
  const type=!/까지/.test(t)&&/일정|약속|회의|미팅|모임|예약|면접|병원|진료|만나|수업|행사|식사|공연|여행/.test(t)?'event':'todo';
  s=s.replace(/언젠가/,' ').replace(/(\s*(추가|등록|저장|잡아|넣어|적어|알려|기억|남겨|해줘)\S*)+\s*$/,'').replace(/\s+/g,' ').trim().replace(/^(에|에는|까지|부터)\s+/,'').replace(/^까지\s*/,'').trim();
  s=s.replace(/(까지)\s*/,' ').replace(/\s+/g,' ').trim();
  return {type,title:s||t.trim(),date:d?ymd(d):(type==='event'?T():null),time,sd,rep};
}

function msg(r,t,cards,brief){const m={r,t,cards,brief};S.msgs.push(m);S.msgs=S.msgs.slice(-40);save();renderChat();return m}
function rangeOf(t){
  const dw=new Date().getDay();
  if(/다음\s*주/.test(t))return [((8-dw)%7)||7,7,'다음 주'];
  if(/이번\s*주/.test(t))return [0,dw===0?1:8-dw,'이번 주'];
  return /모레/.test(t)?[2,1,'모레']:/내일/.test(t)?[1,1,'내일']:[0,1,'오늘'];
}
function listRange(a,len,w){
  const L=[];
  for(let i=a;i<a+len;i++){const d=addD(new Date(),i),ds=ymd(d),pre=len>1?(d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+') ':'';
    evOn(ds).forEach(x=>L.push('• '+pre+(x.d?'종일':fT(hm(x.s)))+' '+x.t));
    S.todos.filter(x=>!x.done&&x.date===ds).sort(sortFn).forEach(x=>L.push('• '+pre+(x.time?fT(x.time)+' ':'')+x.title+' (할 일)'))}
  return L.length?w+' 일정과 할 일이에요.\n'+L.join('\n'):w+'은 잡힌 일정과 할 일이 없어요.';
}

const SYS='너는 한국어 할 일·일정 관리 비서 Aria다. 친근하고 짧게 존댓말로 답한다.\n- 할 일/일정 말은 도구로 바로 처리하고, 시각·날짜는 말한 대로 반영한다. 날짜는 지금 시각 기준으로 계산한다.\n- \"미팅·약속·예약\"+시각은 add_event, 그 외는 add_todo. 주기(매주 월요일 등)는 repeat로 1개만 만든다.\n- 기존 일정/할 일을 바꾸려면 삭제 후 다시 추가한다.\n- 브리핑 요청: show_briefing을 호출하고, 글은 \"먼저 …, 그다음 …\"으로 순서를 잇는 두 문장으로 짧게 쓴다. 지금 시각대에 맞춘다(아침엔 오늘 전체, 낮엔 남은 것, 저녁엔 마무리와 내일). 일정·할 일이 없으면 빈 시간 활용을 제안한다.\n- 사용자의 선호·말투·중요한 사람은 remember로 저장하고, 이후 답과 메일/메시지 초안에 반영한다. 말투를 알려 주면 그 말투로 초안을 써 준다(전송은 못 한다).\n- 날씨·최신 정보는 알 수 없다고 솔직히 말한다. 계좌·카드·주민번호는 저장하지 않고 송금·결제는 대신하지 못한다.\n- 장소 기반 알림과 \"꼭 울려줘\" 무음 해제 알림은 이 웹앱에서는 못 한다고 안내한다.';
async function runAI(text){
  const hist=S.msgs.filter(m=>!m.tmp).slice(-11,-1).map(m=>({role:m.r==='me'?'user':'assistant',content:m.t||'.'}));
  const msgs=hist.concat([{role:'user',content:text}]);
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const cards=[];let brief=0,out='';
  for(let k=0;k<6;k++){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ak,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL,max_tokens:1200,system:SYS+'\n\n'+ctx(),tools:TOOLS,messages:msgs})});
    if(!r.ok){let e='';try{e=(await r.json()).error.message}catch(x){}throw new Error(r.status===401?'AI 키가 올바르지 않아요':(e||'오류 '+r.status))}
    const d=await r.json();msgs.push({role:'assistant',content:d.content});
    out=d.content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    const uses=d.content.filter(b=>b.type==='tool_use');if(!uses.length)break;
    const res=[];
    for(const u of uses){const i=u.input||{};let o='완료';
      try{
        if(u.name==='add_todo'){const it=addTodo({title:i.title,date:i.someday?null:(i.date||null),time:i.time||null,sd:i.someday,rep:i.repeat});cards.push({k:'todo',t:it.title,m:metaOf(it),id:it.id})}
        else if(u.name==='add_event'){const p={title:i.title,date:i.date,time:i.start_time||null,end:i.end_time,rep:i.repeat},r2=await addEvent(p);cards.push({k:'event',t:p.title,m:metaOf(p),id:r2.id,c:r2.c,g:r2.g})}
        else if(u.name==='complete_todo'){const it=S.todos.find(x=>x.id==i.id);if(it&&!it.done){it.done=1;it.dts=Date.now();tsave()}else o='찾지 못함'}
        else if(u.name==='delete_item'){if(i.kind==='todo'){S.todos=S.todos.filter(x=>String(x.id)!==String(i.id));tsave()}else{const x=evs().find(v=>String(v.id)===String(i.id));if(x)await delEvent(x.id,x.c,x.g);else o='찾지 못함'}}
        else if(u.name==='show_briefing')brief=1;
        else if(u.name==='remember'){S.mem.push(i.note);S.mem=S.mem.slice(-30);save()}
      }catch(x){o='실패: '+x.message}
      res.push({type:'tool_result',tool_use_id:u.id,content:o})}
    msgs.push({role:'user',content:res});
  }
  return {text:out||'처리했어요.',cards,brief};
}
async function ask(text){
  text=text.trim();if(!text)return;go('chat');msg('me',text);
  if(S.ak){
    const ph=msg('ai','생각하는 중…');ph.tmp=1;
    try{const r=await runAI(text);S.msgs=S.msgs.filter(m=>m!==ph);msg('ai',r.text,r.cards,r.brief);renderAll();return}
    catch(x){S.msgs=S.msgs.filter(m=>m!==ph);toast('AI 연결 실패: '+x.message+' · 기본 모드로 처리해요')}
  }
  if(/무엇을 할|뭘 할|할 수 있|도움말|사용법/.test(text))return msg('ai',HELP);
  const q=/(알려|뭐야|뭐 있|뭐가 있|보여|어때|브리핑|\?|있어)/.test(text)&&/(일정|할 ?일|브리핑)/.test(text);
  if(q){const [a,n,w]=rangeOf(text);return /브리핑/.test(text)&&n===1&&a===0?msg('ai',briefing(),[],1):msg('ai',listRange(a,n,w),[],/브리핑/.test(text)&&a===0)}
  const cards=[];
  for(const sg of text.split(/[,，;\n]|\s그리고\s/).map(x=>x.trim()).filter(Boolean)){
    const p=parse(sg);
    if(p.type==='event'){const r=await addEvent(p);cards.push({k:'event',t:p.title,m:metaOf(p),id:r.id,c:r.c,g:r.g})}
    else{const it=addTodo(p);cards.push({k:'todo',t:it.title,m:metaOf(it),id:it.id})}
  }
  const a=cards.filter(x=>x.k==='todo').length,b=cards.length-a;
  msg('ai','담았어요. '+[a?'할 일 '+a+'개':'',b?'일정 '+b+'개':''].filter(Boolean).join(', ')+'.'+(b&&!conn()?'\n구글 캘린더를 연결하면 일정이 거기에 들어가요.':''),cards);
}

      +'<li>API 및 서비스 > 라이브러리에서 \"Google Calendar API\"를 사용 설정하세요.</li>'
      +'<li>OAuth 동의 화면 > 외부 > 앱 이름 입력 후 \"테스트 사용자\"에 내 구글 이메일을 추가하세요.</li>'
      +'<li>사용자 인증 정보 > 만들기 > OAuth 클라이언트 ID > 웹 애플리케이션. \"승인된 JavaScript 원본\"에 <code>'+esc(location.origin)+'</code> 를 넣고 만드세요.</li>'
      +'<li>나온 클라이언트 ID를 아래에 붙여넣고 연결하세요. \"확인되지 않은 앱\" 창이 뜨면 고급 > 이동을 누르세요.</li></ol>'
      +'<div class="url"><input id="gu" placeholder="클라이언트 ID 붙여넣기" aria-label="클라이언트 ID"><button class="btn" data-a="gconn">연결</button></div>'
      +'<p class="hint">다른 기기에서 이미 연결했다면, \"다른 기기용 코드\"를 위 칸에 붙여넣으면 돼요.</p>';
  }
  h+='</div><div class="box"><h3>AI 대화<span>'+(S.ak?'켜짐':'꺼짐')+'</span></h3><p class="hint">Anthropic API 키를 넣으면 채팅이 실제 AI로 바뀌어요. 자유로운 말도 알아듣고, 브리핑·말투 기억·메일 초안을 해 줘요. 키는 이 기기에만 저장되고, 사용한 만큼 요금이 나가요. 비워 두면 기본 모드로 동작해요.</p><label class="f" style="margin-top:10px">API 키<input id="ak" type="password" autocomplete="off" value="'+esc(S.ak)+'" placeholder="sk-ant-..."></label>'+(S.mem.length?'<p class="hint">기억 '+S.mem.length+'개 <button class="chip o" data-a="memclr">지우기</button></p>':'')+'</div><div class="box"><h3>알림<span>'+(S.sub?'이 기기 켜짐':'꺼짐')+'</span></h3>';
  if(ios&&!sa)h+='<p class="hint">아이폰(iOS 16.4 이상)은 Safari에서 공유 버튼 > 홈 화면에 추가를 한 뒤, 홈 화면 아이콘으로 열어야 알림을 켤 수 있어요.</p>';
  h+='<label class="f" style="margin-top:12px">아침 알림 시각<input id="nm" type="time" value="'+esc(S.mt)+'"></label>'
    +'<label class="f">일정 미리 알림<select id="nl">'+[0,10,30,60].map(v=>'<option value="'+v+'"'+(S.lead===v?' selected':'')+'>'+(v?v+'분 전':'알리지 않기')+'</option>').join('')+'</select></label>'
    +'<label class="f">구글 캘린더 비공개 주소 (iCal 형식)<input id="ni" value="'+esc(S.ical)+'" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics"></label>'
    +'<p class="hint">구글 캘린더 웹 > 설정 > 내 캘린더 설정 > \"iCal 형식의 비공개 주소\"를 복사해 붙여넣으세요. 서버가 이 주소로 일정을 읽어 알림을 보내요. 비밀번호처럼 다뤄 주세요.</p>'
    +'<div class="bs"><button class="btn" data-a="pon">'+(S.sub?'알림 다시 켜기':'이 기기에서 알림 켜기')+'</button>'
    +(S.sub?'<button class="btn g" data-a="ptest">테스트 알림</button><button class="btn g" data-a="cpcfg">서버 설정값 복사</button>':'')+'</div>'
    +(S.sub?'<ol class="sp"><li>\"서버 설정값 복사\"를 누르세요.</li><li>GitHub 저장소 > Settings > Secrets and variables > Actions > New repository secret에서 이름 <code>PUSH_1</code>, 값에 붙여넣고 저장하세요. 컴퓨터는 <code>PUSH_2</code>를 쓰세요.</li><li>Actions 탭 > \"Aria 알림\" > Run workflow로 바로 시험해 볼 수 있어요.</li></ol>':'')
    +'</div>';
  $('#set').innerHTML=h;
}
document.addEventListener('change',e=>{const i=e.target.id;
  if(i==='nm')S.mt=e.target.value||'08:00';else if(i==='nl')S.lead=+e.target.value;else if(i==='ni')S.ical=e.target.value.trim();else if(i==='ak'){S.ak=e.target.value.trim();renderSet()}else return;save()});
function copy(t){
  const ok=()=>toast('복사했어요');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fb());else fb();
  function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('복사하지 못했어요')}a.remove()}
}

/* 화면 전환·이벤트 */
function go(t){
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  document.querySelectorAll('nav button').forEach(n=>n.classList.toggle('on',n.dataset.t===t));
  if(t==='chat'){const c=$('#chat');c.scrollTop=c.scrollHeight}
  if(t==='set')renderSet();if(t==='cal'){renderCal();ensureRange()}
}
function renderAll(){renderDash();renderTodo();renderChat();if($('#p-cal').classList.contains('on'))renderCal()}
document.addEventListener('click',async e=>{
  if(e.target.id==='sh'){closeSh();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.i;
  if(a==='tab'){go(b.dataset.t);return}
  if(a==='chip'){ask(b.dataset.v);return}
  if(a==='say'){if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(briefing());u.lang='ko-KR';speechSynthesis.speak(u)}return}
  if(a==='tf'){tf=b.dataset.v;open=null;renderTodo();return}
  if(a==='more'){open=open==+id?null:+id;renderTodo();return}
  if(a==='tog'){const it=S.todos.find(x=>x.id==id);if(it){it.done=it.done?0:1;it.dts=it.done?Date.now():null;
    if(it.done&&it.rep){const b=it.date?dAt(it.date):sod(new Date());let n=new Date(b);if(it.rep==='daily')n=addD(b,1);else if(it.rep==='weekly')n=addD(b,7);else n.setMonth(n.getMonth()+1);S.n++;S.todos.push(Object.assign({},it,{id:S.n,done:0,dts:null,date:ymd(n)}))}}tsave();renderAll();return}
  if(a==='mv'){
    const it=S.todos.find(x=>x.id==id),w=b.dataset.w;
    if(w==='x')S.todos=S.todos.filter(x=>x.id!=id);
    else if(it){it.sd=w==='s'?1:0;it.date=w==='s'?null:ymd(addD(new Date(),+w))}
    open=null;tsave();renderAll();return}
  if(a==='resched'){const tm=ymd(addD(new Date(),1));S.todos.forEach(x=>{if(!x.done&&!x.sd&&x.date&&x.date<=T())x.date=tm});tsave();renderAll();toast('남은 할 일을 내일로 옮겼어요');return}
  if(a==='undo'){
    const m=S.msgs[+b.dataset.m],c=m&&m.cards[+b.dataset.c];if(!c)return;c.u=1;save();
    if(c.k==='todo'){S.todos=S.todos.filter(x=>x.id!==c.id);tsave()}else await delEvent(c.id,c.c,c.g);
    renderAll();return}
  if(a==='prev'||a==='next'){const k=a==='next'?1:-1;if(CV==='m')cd.setMonth(cd.getMonth()+k);else cd=addD(cd,k*(CV==='w'?7:CV==='3'?3:1));calSc=calSc;renderCal();ensureRange();return}
  if(a==='today'){cd=new Date();calSc=-1;renderCal();ensureRange();return}
  if(a==='cv'){CV=b.dataset.v;calSc=-1;renderCal();ensureRange();return}
  if(a==='goday'){cd=dAt(b.dataset.d);CV='d';calSc=-1;renderCal();return}
  if(a==='resync'){await sync(0,0,1);toast(G.err?'동기화 실패: '+G.err:'동기화했어요');return}
  if(a==='evnew'){evSheet();return}
  if(a==='shx'){closeSh();return}
  if(a==='evsave'){
    const t=$('#sT').value.trim(),d=$('#sD').value;if(!t||!d){toast('제목과 날짜를 입력해 주세요');return}
    const all=$('#sA').checked;closeSh();
    await addEvent({title:t,date:d,time:all?null:$('#sS').value,end:all?null:$('#sE').value});renderAll();toast('일정을 담았어요');return}
  if(a==='ev'){
    const x=evs().find(v=>String(v.id)===id);if(!x)return;
    sheet('<h3 style="margin-bottom:6px">'+esc(x.t)+'</h3><p class="hint">'+fD(ymd(new Date(x.s)))+' '+(x.d?'종일':fT(hm(x.s))+' ~ '+fT(hm(x.e)))+'</p><div class="bs"><button class="btn r" data-a="evdel" data-i="'+esc(x.id)+'">삭제</button><button class="btn g" data-a="shx">닫기</button></div>');return}
  if(a==='evdel'){const x=evs().find(v=>String(v.id)===id);closeSh();if(x){await delEvent(x.id,x.c,x.g);renderAll()}return}
  if(a==='cpcid'){copy(S.cid);return}
  if(a==='disc'){S.cid='';S.had=0;tok={t:'',x:0};LS('aria2t',tok);save();G.ev=[];G.err='';LS('aria2g',G);renderSet();renderAll();return}
  if(a==='gconn'){
    const v=$('#gu').value.trim();
    if(!/\.apps\.googleusercontent\.com$/.test(v)){toast('xxxx.apps.googleusercontent.com 형태의 클라이언트 ID를 붙여넣어 주세요');return}
    S.cid=v;save();
    try{await gtoken(1)}catch(x){S.cid='';save();toast('연결하지 못했어요: '+x.message);return}
    toast('구글 캘린더를 연결했어요');await sync(0,0,1);renderSet();return}
  if(a==='memclr'){S.mem=[];save();renderSet();return}
  if(a==='pon'){enablePush();return}
  if(a==='ptest'){try{const r=await navigator.serviceWorker.ready;r.showNotification('Aria',{body:'알림이 잘 나와요',icon:'icon-192.png'})}catch(x){toast('테스트 실패: '+x.message)}return}
  if(a==='cpcfg'){copy(JSON.stringify({sub:S.sub,ical:S.ical,mt:S.mt,lead:S.lead,tz:TZN}));return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='cf'){const i=$('#ci');ask(i.value);i.value='';return}
  if(f.id==='tq'){
    const i=f.querySelector('input'),p=parse(i.value);if(!i.value.trim())return;
    if(tf==='today'&&!p.date)p.date=T();else if(tf==='some')p.sd=1;else if(tf==='soon'&&!p.date)p.date=ymd(addD(new Date(),1));
    p.type='todo';addTodo(p);i.value='';renderAll();
  }
});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('#mic');
if(!SR)mic.style.display='none';
else{
  const r=new SR();r.lang='ko-KR';r.interimResults=false;
  r.onresult=e=>ask(e.results[0][0].transcript);
  r.onend=()=>mic.classList.remove('rec');
  r.onerror=()=>{mic.classList.remove('rec');toast('음성 입력을 쓸 수 없어요. 키보드의 마이크 버튼을 써 보세요')};
  mic.onclick=()=>{if(mic.classList.contains('rec')){r.stop();return}try{r.start();mic.classList.add('rec')}catch(x){}};
}
$('#cal').addEventListener('scroll',e=>{if(e.target.id==='tgw')calSc=e.target.scrollTop},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderDash();if(conn())sync()}});
setInterval(renderDash,60000);
renderAll();
if(conn())sync();
</script>
</body>
</html>
